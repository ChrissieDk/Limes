name: Dependency Audit

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - functions/package.json
      - functions/package-lock.json
      - security-exceptions.json
      - docs/security/dependency-exceptions.md

permissions:
  contents: read

jobs:
  policy:
    name: Security exception policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
      - run: node scripts/check-security-exceptions.mjs

  root-audit:
    name: Root dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  functions-audit:
    name: Functions dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm --prefix functions ci
      - run: npm --prefix functions audit --omit=dev --audit-level=high
