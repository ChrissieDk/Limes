name: Quality Gates

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root:
    name: Root app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run security:exceptions
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run check:bundle

  e2e:
    name: Browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholder Firebase config so the app can boot in CI without real secrets.
      # The Playwright specs never make real Firebase calls (client-side validation only),
      # but firebase/analytics throws synchronously at import time if the config is malformed.
      VITE_FIREBASE_API_KEY: AIzaSyTestKeyForCiPreviewOnly00000000
      VITE_FIREBASE_AUTH_DOMAIN: limes-ci-preview.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: limes-ci-preview
      VITE_FIREBASE_STORAGE_BUCKET: limes-ci-preview.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      VITE_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
      VITE_FIREBASE_APP_MEASUREMENT_ID: G-0000000000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e

  functions:
    name: Firebase Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm --prefix functions ci
      - run: npm --prefix functions run test:coverage
      - run: npm --prefix functions run build

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
