name: Feature specification
description: Define a feature before an agent implements it
title: "feat: "
labels: [feature, needs-spec]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operational problem needs solving?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable success, not implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - Given ..., when ..., then ...
        - Error state ...
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: What must the agent not change?
  - type: dropdown
    id: risk
    attributes:
      label: Sensitive areas
      multiple: true
      options:
        - Authentication
        - Payments
        - PII or RICA
        - Firebase Functions
        - External APIs
        - Deployment/configuration
        - None
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Product context and examples
      description: Include designs, copy, edge cases, and constraints. Never include secrets or production PII.
